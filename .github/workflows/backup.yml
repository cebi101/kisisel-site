name: D1 Yedeği

on:
  schedule:
    - cron: "17 3 * * 1" # her pazartesi 03:17 UTC
  workflow_dispatch:

jobs:
  yedek:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Wrangler
        run: npm i -g wrangler

      - name: Veritabanını dışa aktar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 export kisisel-site --remote --output "backup-$(date +%F).sql"

      - name: Yedeği doğrula
        run: |
          f=$(ls backup-*.sql | head -1)
          tablo=$(grep -c 'CREATE TABLE' "$f" || true)
          sayac=$(grep -c 'INSERT INTO counters' "$f" || true)
          echo "tablo: $tablo, sayaç satırı: $sayac"
          test "$tablo" -ge 3 || { echo "HATA: beklenen en az 3 tablo"; exit 1; }

      # NOT: Üretim verisi depoya COMMIT EDİLMEZ; yalnızca 90 gün saklanan
      # iş artefaktı olarak yüklenir (KVKK: ziyaretçi notları ve ip_hash'ler
      # git geçmişine asla girmez).
      - uses: actions/upload-artifact@v4
        with:
          name: d1-yedek
          path: backup-*.sql
          retention-days: 90
