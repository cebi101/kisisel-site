# Cloudflare Pages yapılandırması
# Gizli değerler (IP_SALT, ADMIN_TOKEN, RESEND_API_KEY) BURAYA YAZILMAZ —
# panelde secret olarak tutulur.

name = "kisisel-site"
compatibility_date = "2026-08-04"
pages_build_output_dir = "dist"

# DÜZ DEĞİŞKENLER
# wrangler.toml varken Cloudflare panelinden düz değişken EKLENEMEZ —
# panel yalnız Secret kabul eder ("Environment variables ... are being
# managed through wrangler.toml"). Gizli olmayanlar bu yüzden burada.
[vars]
# Gönderen adresi. Sandbox: alan adı doğrulaması GEREKTİRMEZ.
# Kendi alan adına geçmek istersen yalnız bu satırı değiştir; kod değişmez.
MAIL_FROM = "Site formu <onboarding@resend.dev>"
CONTACT_TO = "seymanurcebi6@gmail.com"

# ÜRETİM ve YEREL GELİŞTİRME
# Pages'te üst düzey bağlama hem üretimde hem `wrangler pages dev` sırasında
# kullanılır. `[env.production]` altına taşınırsa yerel geliştirme bağlamayı
# bulamaz (`pages dev` --env bayrağını kabul etmiyor).
[[d1_databases]]
binding = "DB"
database_name = "kisisel-site"
database_id = "abfc1fc2-bf9e-4c49-a4e8-f81da1bb88ea"

# ÖNİZLEME — dal dağıtımları buraya yazar; gerçek notlar ve sayaç kirlenmez.
[[env.preview.d1_databases]]
binding = "DB"
database_name = "kisisel-site-preview"
database_id = "79139fcf-8482-4b32-9ab5-3e8e438f8bc2"
